title: Crontab Replaced
id: e4b599d8-d364-49f0-aa4e-4f1328b0f26c
status: stable
description: A user's crontab was replaced or deleted. Cron jobs are a common persistence mechanism.
author: Vigil
tags:
    - attack.persistence
    - attack.t1053.003
logsource:
    product: linux
    service: cron
detection:
    selection:
        event.action: crontab_modified
    condition: selection
falsepositives:
    - Configuration management tools
level: low
